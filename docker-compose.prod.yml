version: '3.9'

services:
  # PostgreSQL Database with pgvector
  postgres:
    image: pgvector/pgvector:pg15-latest
    container_name: neuroai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neurodegenrx}
      POSTGRES_USER: ${POSTGRES_USER:-neurodegenrx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurodegenrx_secure_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neurodegenrx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neuroai-network

  # Redis Cache and Message Broker
  redis:
    image: redis:7-alpine
    container_name: neuroai-redis
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neuroai-network

  # Django REST API Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: neuroai-backend
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-neurodegenrx}:${POSTGRES_PASSWORD:-neurodegenrx_secure_dev}@postgres:5432/${POSTGRES_DB:-neurodegenrx}
      # Redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # Application
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      # MedGemma
      MEDGEMMA_API_KEY: ${MEDGEMMA_API_KEY:-}
      MEDGEMMA_USE_LOCAL: ${MEDGEMMA_USE_LOCAL:-False}
      # ML Model paths
      ML_MODELS_PATH: /app/models
    volumes:
      - ./backend:/app
      - ml_models:/app/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn neurodegenrx_backend.wsgi:application 
             --bind 0.0.0.0:8000 
             --workers 4 
             --worker-class sync 
             --timeout 120"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - neuroai-network

  # Celery Worker for Async Tasks
  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: neuroai-celery
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-neurodegenrx}:${POSTGRES_PASSWORD:-neurodegenrx_secure_dev}@postgres:5432/${POSTGRES_DB:-neurodegenrx}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      ML_MODELS_PATH: /app/models
    volumes:
      - ./backend:/app
      - ml_models:/app/models
    depends_on:
      - postgres
      - redis
      - backend
    command: celery -A neurodegenrx_backend worker -l info --concurrency=4
    networks:
      - neuroai-network

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: neuroai-celery-beat
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-neurodegenrx}:${POSTGRES_PASSWORD:-neurodegenrx_secure_dev}@postgres:5432/${POSTGRES_DB:-neurodegenrx}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - backend
    command: celery -A neurodegenrx_backend beat -l info
    networks:
      - neuroai-network

  # React Frontend
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: neuroai-frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_APP_NAME: NeuroAI
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev
    networks:
      - neuroai-network

  # Optional: Flower for Celery Monitoring
  flower:
    image: mher/flower:2.0
    container_name: neuroai-flower
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery
    networks:
      - neuroai-network

  # Optional: pgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: neuroai-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@neuroai.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - neuroai-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ml_models:
    driver: local
  pgadmin_data:
    driver: local

networks:
  neuroai-network:
    driver: bridge
