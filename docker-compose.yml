version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: neurodegenrx
      POSTGRES_USER: neurodegenrx
      POSTGRES_PASSWORD: neurodegenrx_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
        - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=neurodegenrx
      - POSTGRES_USER=neurodegenrx
      - POSTGRES_PASSWORD=neurodegenrx_dev
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
